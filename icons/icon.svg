<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191f"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e36"/>
      <stop offset="100%" stop-color="#e02424"/>
    </linearGradient>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#grad-bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#2a2b36" stroke-width="2"/>

  <!-- Outer frame border with subtle cut corner -->
  <rect x="96" y="96" width="320" height="320" rx="28" fill="none" stroke="#374151" stroke-width="10"/>

  <!-- Red Brand Dot accent (Leica homage) -->
  <circle cx="120" cy="120" r="14" fill="url(#grad-accent)" filter="url(#glow)"/>

  <!-- Aperture Blades Circle -->
  <g transform="translate(256, 256)">
    <circle r="96" fill="none" stroke="url(#grad-gold)" stroke-width="6" opacity="0.9"/>
    
    <!-- 6 Stylized Aperture Blades -->
    <path d="M 0 -88 C 45 -88, 70 -50, 48 -16 L 24 -8 Z" fill="#ff5e36" opacity="0.9"/>
    <path d="M 0 -88 C 45 -88, 70 -50, 48 -16 L 24 -8 Z" fill="#ff7849" opacity="0.9" transform="rotate(60)"/>
    <path d="M 0 -88 C 45 -88, 70 -50, 48 -16 L 24 -8 Z" fill="#f59e0b" opacity="0.9" transform="rotate(120)"/>
    <path d="M 0 -88 C 45 -88, 70 -50, 48 -16 L 24 -8 Z" fill="#fbbf24" opacity="0.9" transform="rotate(180)"/>
    <path d="M 0 -88 C 45 -88, 70 -50, 48 -16 L 24 -8 Z" fill="#ef4444" opacity="0.9" transform="rotate(240)"/>
    <path d="M 0 -88 C 45 -88, 70 -50, 48 -16 L 24 -8 Z" fill="#dc2626" opacity="0.9" transform="rotate(300)"/>

    <!-- Center aperture opening -->
    <circle r="34" fill="#0d0e12"/>
  </g>

  <!-- Bottom frame metadata strip graphic representation -->
  <rect x="124" y="366" width="264" height="20" rx="4" fill="#1f232b"/>
  <rect x="136" y="373" width="70" height="6" rx="3" fill="#9ca3af"/>
  <rect x="220" y="373" width="40" height="6" rx="3" fill="#ff5e36"/>
  <rect x="274" y="373" width="50" height="6" rx="3" fill="#f59e0b"/>
  <rect x="338" y="373" width="38" height="6" rx="3" fill="#60a5fa"/>
</svg>
