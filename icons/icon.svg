<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Round Circle Base (Warm Coral Red) -->
  <circle cx="256" cy="256" r="248" fill="#FF4D36"/>

  <!-- Exhibition / Polaroid White Photo Frame -->
  <rect x="112" y="98" width="288" height="316" rx="36" fill="#FFFFFF"/>

  <!-- Photo Area Inner Cutout (Deep Dark Slate to make the cute camera pop!) -->
  <rect x="134" y="120" width="244" height="208" rx="22" fill="#141620"/>

  <!-- Cute Camera Inside the Frame -->
  <!-- Top Viewfinder Hump -->
  <path d="M 218 168 L 228 150 C 230 146, 235 144, 240 144 L 272 144 C 277 144, 282 146, 284 150 L 294 168 Z" fill="#FFFFFF"/>
  <!-- Top Shutter Button -->
  <rect x="170" y="156" width="30" height="14" rx="6" fill="#FFFFFF"/>
  <!-- Camera Body -->
  <rect x="156" y="168" width="200" height="132" rx="28" fill="#FFFFFF"/>

  <!-- Viewfinder Red Dot Accent (Leica Homage) -->
  <circle cx="188" cy="194" r="8" fill="#FF4D36"/>

  <!-- Big Round Cute Lens -->
  <circle cx="256" cy="234" r="44" fill="#141620"/>
  <circle cx="256" cy="234" r="32" fill="#FF4D36"/>
  <circle cx="256" cy="234" r="16" fill="#141620"/>
  <!-- Lens Sparkle / Catchlight -->
  <circle cx="264" cy="226" r="6" fill="#FFFFFF"/>

  <!-- Metadata Strip on Bottom Margin of Frame -->
  <!-- Capsule 1: Lens / Focal Length (Cyan) -->
  <rect x="138" y="348" width="58" height="18" rx="9" fill="#0284c7" opacity="0.15"/>
  <rect x="144" y="353" width="46" height="8" rx="4" fill="#0284c7"/>

  <!-- Capsule 2: Aperture / Shutter (Coral Red) -->
  <rect x="204" y="348" width="48" height="18" rx="9" fill="#FF4D36" opacity="0.15"/>
  <rect x="210" y="353" width="36" height="8" rx="4" fill="#FF4D36"/>

  <!-- Capsule 3: ISO Sensitivity (Amber Gold) -->
  <rect x="260" y="348" width="54" height="18" rx="9" fill="#f59e0b" opacity="0.15"/>
  <rect x="266" y="353" width="42" height="8" rx="4" fill="#d97706"/>

  <!-- Brand Red Logo Dot Accent on Bottom Right -->
  <circle cx="360" cy="357" r="7" fill="#FF4D36"/>

  <!-- Clean Sub-metadata Hairline Underneath -->
  <rect x="138" y="378" width="160" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="312" y="378" width="56" height="4" rx="2" fill="#94a3b8"/>
</svg>
